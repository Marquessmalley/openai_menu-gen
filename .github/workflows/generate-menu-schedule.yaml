name: Execute Monthly Menu Schedule

on:
  schedule:
    - cron: "0 9 1 * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-program:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install

      - name: Build Program
        run: npm run build

      - name: Run Program
        env:
          OPEN_AI_KEY: ${{ secrets.OPEN_AI_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: npm run start

      - name: Commit and Push Generated Menu
        run: |
          git config --local user.email "marquessmalley@gmail.com"
          git config --local user.name "Marquessmalley"
          git add src/data/output/
          git diff --staged --quiet || git commit -m "📅 Add monthly menu for $(date +'%B %Y')"
          git push
